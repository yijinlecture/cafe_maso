<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAFE MASO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <p class="eyebrow">NIGHT COFFEE BAR</p>
    <h1 id="shop-name">CAFE MASO</h1>
    <p class="slogan">당신의 하루를 굽습니다</p>
    <span id="status-badge" class="badge">확인 중...</span>
  </header>
  <main>
    <section class="menu">
      <div class="section-heading">
        <h2>오늘 밤의 메뉴</h2>
        <span>COFFEE &amp; NON-COFFEE</span>
      </div>
      <ul id="menu-list">
        <li><span>아메리카노</span><strong>4,500원</strong></li>
        <li><span>카페라떼</span><strong>5,000원</strong></li>
        <li><span>아인슈페너</span><strong>4,000원</strong></li>
        <li><span>히비스커스</span><strong>8,000원</strong></li>
      </ul>
    </section>
    <section class="hours">
      <p class="hours-label">NIGHT HOURS</p>
      <h2>매일 밤, 편안히 머물다 가세요.</h2>
      <p class="hours-time">09:00 <span>—</span> 22:00</p>
      <p class="last-order">라스트 오더 21:30</p>
    </section>
  </main>
  <footer>
    <p>© 카페 마소</p>
  </footer>
  <script src="app.js"></script>
</body>
</html>
